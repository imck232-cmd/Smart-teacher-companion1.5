<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>رفيق المعلم الذكي</title>
    
    <!-- Google Fonts (Critical Fonts Loaded Initially) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;700;800&family=Tajawal:wght@300;400;500;700&family=Amiri:wght@400;700&family=Lalezar&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet" id="critical-google-fonts">

    <!-- FontAwesome Free Icons (Loaded asynchronously) -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" as="style">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" media="print" onload="this.media='all'">

    <!-- modulepreload for fast parallel JS retrieval -->
    <link rel="modulepreload" href="/index.tsx">
    <link rel="modulepreload" href="/App.tsx">

    <!-- Core Libraries -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.18/mammoth.browser.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script defer>
      window.addEventListener('DOMContentLoaded', () => {
        if (window.pdfjsLib) {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
        }
      });
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class', 
        theme: {
          extend: {
            fontFamily: {
              sans: ['var(--font-body)', 'sans-serif'],
              heading: ['var(--font-heading)', 'serif'],
            },
            colors: {
              primary: 'rgb(var(--color-primary) / <alpha-value>)',
              secondary: 'rgb(var(--color-secondary) / <alpha-value>)',
              icon: 'rgb(var(--color-icon) / <alpha-value>)',
              'base-text': 'rgb(var(--color-base-text) / <alpha-value>)',
              'heading-text': 'rgb(var(--color-heading-text) / <alpha-value>)',
              'component-bg': 'rgb(var(--color-component-bg) / <alpha-value>)',
              'border': 'rgb(var(--color-border) / <alpha-value>)',
              'base-bg': 'rgb(var(--color-base-bg) / <alpha-value>)',
            }
          }
        }
      }
    </script>

    <style>
        :root {
            --font-body: 'Cairo', sans-serif;
            --font-heading: 'Reem Kufi', serif;
            --color-primary: 132 204 22;
            --color-secondary: 34 197 94;
            --color-icon: 209 250 229;
            --color-border: 55 65 81;
            --color-base-text: 229 231 235;
            --color-heading-text: 255 255 255;
            --color-base-bg: 17 24 39;
            --color-component-bg: 31 41 55;
            --color-shadow-light: 36 59 85;
            --color-shadow-dark: 8 12 19;
            --font-weight-base: 400;
        }

        body {
            font-family: var(--font-body);
            background-color: rgb(var(--color-base-bg));
            color: rgb(var(--color-base-text));
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            overflow-x: hidden;
            transition: background 0.2s ease-out;
        }
        
        .neumorphic-inset {
            background-color: rgb(var(--color-component-bg)) !important; 
            border-radius: 0.75rem;
            border: 1px solid rgb(var(--color-primary) / 0.2);
            box-shadow: inset 1px 1px 4px rgba(0, 0, 0, 0.15);
            color: rgb(var(--color-base-text)) !important;
        }

        .neumorphic-outset {
            background-color: rgb(var(--color-component-bg));
            backdrop-filter: blur(8px);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(var(--color-shadow-dark) / 0.15), 0 2px 4px -1px rgb(var(--color-shadow-light) / 0.1);
            border: 1px solid rgb(var(--color-border) / 0.2);
        }

        .neumorphic-button {
            background-color: rgb(var(--color-component-bg));
            border: 1px solid rgb(var(--color-border) / 0.2);
            box-shadow: 2px 2px 5px rgb(var(--color-shadow-dark) / 0.15), -2px -2px 5px rgb(var(--color-shadow-light) / 0.05);
            border-radius: 0.5rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .neumorphic-button:hover {
            transform: translateY(-1px);
            box-shadow: 3px 3px 6px rgb(var(--color-shadow-dark) / 0.2), -3px -3px 6px rgb(var(--color-shadow-light) / 0.08);
            border-color: rgb(var(--color-primary) / 0.4);
        }
        .neumorphic-button:active {
            transform: translateY(1px);
            box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.2);
        }
        
        .animate-ticker {
             display: inline-block;
             animation: ticker-swipe 25s linear infinite;
             will-change: transform;
             transform: translate3d(0, 0, 0);
        }

        @keyframes ticker-swipe {
            0% { transform: translate3d(100%, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        .animate-fadeIn { animation: fadeIn 0.25s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media print {
            .no-print { display: none !important; }
            * { transition: none !important; animation: none !important; box-shadow: none !important; }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^18.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^18.2.0/",
    "react/": "https://aistudiocdn.com/react@^18.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.1",
    "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0",
    "vite": "https://aistudiocdn.com/vite@^7.2.2",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      // Load secondary/tertiary Arabic fonts after the page is fully loaded and interactive
      window.addEventListener('load', () => {
        setTimeout(() => {
          const fontLink = document.createElement('link');
          fontLink.rel = 'stylesheet';
          fontLink.href = 'https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Aref+Ruqaa:wght@400;700&family=Noto+Kufi+Arabic:wght@300;400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Changa:wght@300;500;700&family=El+Messiri:wght@400;700&family=Readex+Pro:wght@300;400;600;700&display=swap';
          document.head.appendChild(fontLink);
        }, 1500);
      });
    </script>
</body>
</html>
