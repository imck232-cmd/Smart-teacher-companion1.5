    <!-- Core Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.18/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script>
      if (window.pdfjsLib) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
      }
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class', 
        theme: {
          extend: {
            fontFamily: {
              sans: ['var(--font-body)', 'sans-serif'],
              heading: ['var(--font-heading)', 'serif'],
            },
            colors: {
              primary: 'rgb(var(--color-primary) / <alpha-value>)',
              secondary: 'rgb(var(--color-secondary) / <alpha-value>)',
              icon: 'rgb(var(--color-icon) / <alpha-value>)',
              'base-text': 'rgb(var(--color-base-text) / <alpha-value>)',
              'heading-text': 'rgb(var(--color-heading-text) / <alpha-value>)',
              'component-bg': 'rgb(var(--color-component-bg) / <alpha-value>)',
            }
          }
        }
      }
    </script>

    <style>
        :root {
            --font-body: 'Cairo', sans-serif;
            --font-heading: 'Reem Kufi', serif;
        }

        body {
            font-family: var(--font-body);
            background-color: rgb(var(--color-base-bg));
            color: rgb(var(--color-base-text));
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            overflow-x: hidden;
            transition: background 0.2s ease-out;
        }
        
        .neumorphic-inset {
            background-color: #ffffff !important; 
            border-radius: 0.75rem;
            border: 1px solid rgba(var(--color-primary), 0.1);
            box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.05);
            color: #000 !important;
        }

        .neumorphic-outset {
            background-color: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        
        .animate-ticker {
             display: inline-block;
             animation: ticker-swipe 25s linear infinite;
             will-change: transform;
             transform: translate3d(0, 0, 0);
        }

        @keyframes ticker-swipe {
            0% { transform: translate3d(100%, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        .animate-fadeIn { animation: fadeIn 0.25s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media print {
            .no-print { display: none !important; }
            * { transition: none !important; animation: none !important; box-shadow: none !important; }
        }
    </style>
